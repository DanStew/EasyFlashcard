name: Deploy Frontend to Google Cloud Run

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      service_url:
        description: "The deployed Cloud Run frontend service URL"
        value: ${{ jobs.deploy.outputs.service_url }}

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build & Deploy Frontend to Cloud Run
    runs-on: ubuntu-latest
    outputs:
      service_url: ${{ steps.deploy.outputs.SERVICE_URL }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Strict validation: Ensure all required GCP deployment secrets are provided
      - name: Validate Required Secrets
        shell: bash
        run: |
          echo "Validating required GitHub Secrets for frontend deployment..."
          MISSING=""

          if [ -z "${{ secrets.GCP_PROJECT_ID }}" ]; then
            MISSING="${MISSING} GCP_PROJECT_ID"
          fi
          if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            MISSING="${MISSING} GCP_SA_KEY"
          fi
          if [ -z "${{ secrets.GCP_REGION }}" ]; then
            MISSING="${MISSING} GCP_REGION"
          fi
          if [ -z "${{ secrets.GCP_ARTIFACT_REPO }}" ]; then
            MISSING="${MISSING} GCP_ARTIFACT_REPO"
          fi

          if [ -n "$MISSING" ]; then
            echo "::error::Missing required GitHub Secrets:${MISSING}"
            echo "Please navigate to Repository Settings -> Secrets and variables -> Actions and configure all required secrets."
            echo "Refer to docs/GCP_DEPLOYMENT_SETUP.md for complete instructions."
            exit 1
          fi

          echo "All required deployment secrets are present and non-empty."

      # Authenticate to Google Cloud using Service Account JSON Key
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Set up gcloud Cloud SDK CLI
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # Configure Docker auth helper for Google Artifact Registry
      - name: Configure Docker for Artifact Registry
        shell: bash
        run: |
          gcloud auth configure-docker "${{ secrets.GCP_REGION }}-docker.pkg.dev" --quiet

      # Build and Push Docker image to Artifact Registry with Vite build arguments
      - name: Build and Push Docker Image
        shell: bash
        run: |
          SERVICE_NAME="${{ secrets.GCP_FRONTEND_SERVICE_NAME || 'easyflashcard-frontend' }}"
          IMAGE_TAG="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_ARTIFACT_REPO }}/${SERVICE_NAME}:${{ github.sha }}"
          LATEST_TAG="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_ARTIFACT_REPO }}/${SERVICE_NAME}:latest"

          echo "Building frontend Docker image (${SERVICE_NAME}) with build-time environment arguments..."
          
          docker build \
            --build-arg VITE_API_BASE_URL="${{ secrets.VITE_API_BASE_URL || vars.VITE_API_BASE_URL }}" \
            --build-arg VITE_FIREBASE_API_KEY="${{ secrets.VITE_FIREBASE_API_KEY || vars.VITE_FIREBASE_API_KEY }}" \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN="${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || vars.VITE_FIREBASE_AUTH_DOMAIN }}" \
            --build-arg VITE_FIREBASE_PROJECT_ID="${{ secrets.VITE_FIREBASE_PROJECT_ID || vars.VITE_FIREBASE_PROJECT_ID || secrets.GCP_PROJECT_ID }}" \
            --build-arg VITE_FIREBASE_STORAGE_BUCKET="${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || vars.VITE_FIREBASE_STORAGE_BUCKET }}" \
            --build-arg VITE_FIREBASE_MESSAGING_SENDER_ID="${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}" \
            --build-arg VITE_FIREBASE_APP_ID="${{ secrets.VITE_FIREBASE_APP_ID || vars.VITE_FIREBASE_APP_ID }}" \
            --build-arg VITE_OAUTH_CLIENT_ID="${{ secrets.VITE_OAUTH_CLIENT_ID || vars.VITE_OAUTH_CLIENT_ID }}" \
            -t "${IMAGE_TAG}" \
            -t "${LATEST_TAG}" \
            ./frontend

          echo "Pushing frontend images to Artifact Registry..."
          docker push "${IMAGE_TAG}"
          docker push "${LATEST_TAG}"

      # Deploy container to Google Cloud Run
      - name: Deploy to Cloud Run
        id: deploy
        shell: bash
        run: |
          SERVICE_NAME="${{ secrets.GCP_FRONTEND_SERVICE_NAME || 'easyflashcard-frontend' }}"
          IMAGE_TAG="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_ARTIFACT_REPO }}/${SERVICE_NAME}:${{ github.sha }}"

          echo "Deploying ${IMAGE_TAG} to Cloud Run service ${SERVICE_NAME} in ${{ secrets.GCP_REGION }}..."

          gcloud run deploy "${SERVICE_NAME}" \
            --image "${IMAGE_TAG}" \
            --region "${{ secrets.GCP_REGION }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --platform managed \
            --allow-unauthenticated \
            --port 80 \
            --format 'value(status.url)' > service_url.txt

          SERVICE_URL=$(cat service_url.txt)
          echo "SERVICE_URL=${SERVICE_URL}" >> $GITHUB_OUTPUT
          echo "Frontend deployed successfully to: ${SERVICE_URL}"

      # Verify Frontend HTTP response
      - name: Verify Web Frontend Endpoint
        shell: bash
        run: |
          SERVICE_URL="${{ steps.deploy.outputs.SERVICE_URL }}"
          echo "Testing HTTP response on ${SERVICE_URL}..."

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${SERVICE_URL}" || echo "000")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "Web frontend is active and responding (HTTP 200)."
          else
            echo "::warning::Web endpoint returned HTTP status: ${HTTP_CODE}. Cloud Run container may still be initialising."
          fi

          echo ""
          echo "============================================================"
          echo "Frontend Cloud Run Deployment Complete!"
          echo "Service URL: ${SERVICE_URL}"
          echo "============================================================"
