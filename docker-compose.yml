services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: easyflashcard-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/service-account.json:/app/service-account.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - easyflashcard-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: easyflashcard-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - easyflashcard-network

networks:
  easyflashcard-network:
    driver: bridge
